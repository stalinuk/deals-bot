name: Deal checker

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:         # lets you click "Run workflow" manually

permissions:
  contents: read

concurrency:
  group: deals-bot
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json remembers what was already alerted, so you aren't
      # notified about the same deal every 15 minutes.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: deals-state-${{ github.run_id }}
          restore-keys: deals-state-

      - name: Check prices
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: deals-state-${{ github.run_id }}
