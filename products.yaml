# ---------------------------------------------------------------------------
# DealsBot watch list.  One line per product:   Product name: target price
# You get a phone notification when a deal at or below that price shows up.
# ---------------------------------------------------------------------------

products:
  Apple AirPods Pro 3: 140
  Apple Watch Series 8: 200
  Amazon Echo Show 15: 69.99


# ---------------------------------------------------------------------------
# Settings (optional - the defaults are fine)
# ---------------------------------------------------------------------------
settings:
  ntfy_server: https://ntfy.sh   # your topic name goes in the NTFY_TOPIC secret
  realert_hours: 12              # remind again about the same store price after 12 h (0 = never)
  notify_errors: true            # warn me if a store link keeps failing
  error_alert_after: 12          # ...after 12 failed checks in a row (~3 h at 15 min)
  search_stores: [Walmart, Target]   # stores searched by product name every 15 min

  # Alert for ANY Apple product posted on Slickdeals at 50% off or more,
  # even if it isn't in your products list above.
  discount_watch:
    brand: Apple
    min_discount: 50                 # percent off
    queries: [Apple, AirPods, iPad, MacBook, iPhone]

  # Alert for ANY product in a category posted on Slickdeals at 50% off or more.
  # A post must show the size (55", 55 in, 55x24, 140 cm...) and one phrase
  # from EACH match_all group in its title. Add more categories as more "- name:" entries.
  category_watch:
    - name: 55" height adjustable table
      min_discount: 50               # percent off
      size_inches: 55
      queries: [standing desk, height adjustable desk, height adjustable table,
                sit stand desk, electric standing desk, adjustable standing desk]
      match_all:
        - [desk, table, workstation]
        - [height adjustable, adjustable height, standing, stand up, sit stand,
           sit to stand, electric, motorized]
      exclude: [converter, riser, mat, tv, monitor, chair, frame only, treadmill, lift top]

  # Alert for ANY new Slickdeals post (any product) that is 70% off or more, or FREE.
  hot_deals:
    min_discount: 70                 # percent off
    include_free: true               # also alert for freebies (not "free shipping")


