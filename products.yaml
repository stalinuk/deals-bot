# ---------------------------------------------------------------------------
# DealsBot watch list.  One line per product:   Product name: target price
# You get a phone notification when a deal at or below that price shows up.
# ---------------------------------------------------------------------------

products:
  Apple AirPods Pro 3: 140
  Apple Watch Series 8: 200


# ---------------------------------------------------------------------------
# Settings (optional - the defaults are fine)
# ---------------------------------------------------------------------------
settings:
  ntfy_server: https://ntfy.sh   # your topic name goes in the NTFY_TOPIC secret
  realert_hours: 12              # remind again about the same store price after 12 h (0 = never)
  notify_errors: true            # warn me if a store link keeps failing
  error_alert_after: 12          # ...after 12 failed checks in a row (~3 h at 15 min)
  search_stores: [Walmart, Target]   # stores searched by product name every 15 min

  # Alert for ANY Apple product posted on Slickdeals at 50% off or more,
  # even if it isn't in your products list above.
  discount_watch:
    brand: Apple
    min_discount: 50                 # percent off
    queries: [Apple, AirPods, iPad, MacBook, iPhone]


# ---------------------------------------------------------------------------
# ADVANCED (optional): also check exact store pages every 15 minutes.
# Use this long form instead of the one-line form for a product, e.g.:
